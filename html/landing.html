<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <title>Zanzibar Universal Pensioner Scheme</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="../public/assets/SMZ.png">
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css?family=Montserrat:500,600|Kanit:400" rel="stylesheet" />
</head>

<body>
    <div class="desktop">
        <img class="clip-path-group" alt="Clip path group" src="../public/assets/Clip_path_group.png" />

        <img class="group" alt="Group" src="../public/assets/Group.png" />
        <!-- 
        <div class="registration-portal">
            <div class="portal-bg"></div>
            <img class="portal-logo" alt="Registration portal" src="../public/assets/SMZ.png" />
        </div> -->

        <div class="main-card">
            <div class="card-background">
                <img alt="Background" src="../public/assets/background.png" />
            </div>

            <!-- <img class="card-logo" alt="Logo" src="../public/assets/logo_zanzibar.png" /> -->

            <div class="welcome-text">Welcome To</div>

            <h2 class="main-title">Zanzibar Universal Pensioner Scheme</h2>



            <!-- <h1 class="card-title">Zanzibar Universal Pensioner Scheme</h1> -->

            <button class="know-more-btn">Know More</button>
        </div>

        <div class="illustration-container">
            <img class="zanzibar-illustration" src="../public/assets/zanzibar_pension_illustration.png"
                alt="Zanzibar Pension Illustration" />
        </div>

        <!-- <h2 class="main-title">Zanzibar Universal Pensioner Scheme</h2>

        <div class="welcome-text">Welcome To</div> -->

        <div class="registration-portal">
            <div class="portal-bg"></div>
            <img class="portal-logo" alt="Registration portal" src="../public/assets/SMZ.png" />
        </div>

        <img class="card-logo" alt="Logo" src="../public/assets/logo_zanzibar.png" />

        <header class="header">
            <button class="menu-btn">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="4" x2="20" y1="12" y2="12" />
                    <line x1="4" x2="20" y1="6" y2="6" />
                    <line x1="4" x2="20" y1="18" y2="18" />
                </svg>
            </button>
        </header>

        <div class="color-stripes">
            <div class="stripe stripe-green"></div>
            <!-- <div class="stripe stripe-yellow"></div> -->
            <div class="stripe stripe-black"></div>
            <div class="stripe stripe-blue"></div>
        </div>

        <div class="portals-container">
            <a href="${SR_REGISTRATION_PORTAL_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="shehias Portal" src="../public/assets/Shehias.png" />
                    <span>Shehia's <br />Portal</span>
                </button>
            </a>

            <a href="${SR_PENSIONER_REGISTRY_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="Pensioner Registry" src="../public/assets/Pensioner_registry.png" />
                    <span>Pensioner Registry</span>
                </button>
            </a>

            <a href="${SR_DASHBOARD_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="Dashboard" src="../public/assets/dashboard.png" />
                    <span>Pensioner Dashboard</span>
                </button>
            </a>

            <a href="${SR_PENSION_MANAGEMENT_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="ZUPS Pension Management" src="../public/assets/Pension_Management.png" />
                    <span>Pension Management</span>
                </button>
            </a>

            <a href="${PBMS_DASHBOARD_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="PBMSDashboard" src="../public/assets/dashboard.png" />
                    <span>PBMS<br /> Dashboard</span>
                </button>
            </a>

            <!-- <a href="${SR_ADMIN_CONSOLE_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="Admin Console" src="../public/assets/adminconsole.png" />
                    <span>Admin Console</span>
                </button>
            </a> -->

            <a href="${SR_BENEFICIARY_PORTAL_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="Beneficiary Portal" src="../public/assets/benf_portal.png" />
                    <span>Beneficiary Portal</span>
                </button>
            </a>

            <a href="${SR_MINLO_DASHBOARD_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="Minlo Dashboard" src="../public/assets/minlo.png" />
                    <span>Minlo Dashboard</span>
                </button>
            </a>

            <a href="${SR_G2P_BRIDGE_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="G2P Bridge" src="../public/assets/g2p_bridge.png" />
                    <span>G2P Bridge</span>
                </button>
            </a>

            <a href="${SR_SPAR_URL}" target="_blank">
                <button class="portal-item">
                    <img alt="SPAR" src="../public/assets/spar.png" />
                    <span>SPAR</span>
                </button>
        </div>
    </div>
</body>

</html>
